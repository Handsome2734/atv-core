name: Build and Release Apple TV Remote

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft GitHub release with the DMG'
        required: false
        type: boolean
        default: false

jobs:
  build-macos:
    name: Build macOS App & DMG (Apple Silicon)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust Tests
        run: |
          cargo test --workspace

      - name: Import Code Signing Certificate
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          if [ -n "$CERT_BASE64" ]; then
            echo "🔐 Found certificate secret, importing to runner keychain..."
            echo "$CERT_BASE64" | base64 --decode > /tmp/runner_cert.p12
            chmod +x ./scripts/import_certificate.sh
            ./scripts/import_certificate.sh /tmp/runner_cert.p12 "$CERT_PASSWORD"
            rm -f /tmp/runner_cert.p12
          else
            echo "❌ 致命错误: 未检测到证书 Secret (MACOS_CERT_P12_BASE64)！请在 GitHub 仓库中配置该 Secret。"
            exit 1
          fi

      - name: Build AppleTVRemote DMGs (arm64 & x86_64)
        run: |
          chmod +x ./scripts/*.sh
          ./scripts/build_dmg.sh all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVRemote-macOS
          path: |
            build/AppleTVRemote-arm64.dmg
            build/AppleTVRemote-x86_64.dmg
          retention-days: 14

      - name: Publish GitHub Release (on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/AppleTVRemote-arm64.dmg
            build/AppleTVRemote-x86_64.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows EXE (x86_64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build atv-cli
        run: |
          cargo build --release -p atv-cli
          Copy-Item target/release/atv-cli.exe AppleTVRemote-windows-x86_64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleTVRemote-Windows
          path: AppleTVRemote-windows-x86_64.exe
          retention-days: 14

      - name: Publish GitHub Release (on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: AppleTVRemote-windows-x86_64.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android TV APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Pre-installed Android NDK
        run: |
          # Use pre-installed NDK from GitHub Actions runner (zero download time)
          NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n1)
          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          fi
          echo "Found pre-installed NDK: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-ndk (Prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Decode Signing Certificate (.p12)
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT_BASE64" ]; then
            echo "$CERT_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/Corvo_Development.p12"
            echo "🔐 Certificate decoded for APK signing."
          else
            echo "⚠️ Warning: MACOS_CERT_P12_BASE64 secret not found. APK will remain unsigned."
          fi

      - name: Build and Sign Android APK
        env:
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          chmod +x ./scripts/*.sh
          chmod +x ./android-tv/gradlew
          ./scripts/build_android.sh release "$GITHUB_WORKSPACE/Corvo_Development.p12" "${MACOS_CERT_P12_PASSWORD:-corvo-developer}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FakeAtv-Android
          path: |
            android-tv/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Release (on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-tv/app/build/outputs/apk/release/FakeAtv-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

